<title>FDE Engagement Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ HGS brand tokens — source: hgs.com/brand ============
   Impact Green is accent ONLY: never behind body copy, never a large block. */
:root{
  --impact-green:#ABCF02; --primary-blue:#00B0F0;
  --sage:#9AAC94; --system:#26476B; --foundation:#5C6D72; --teal:#3D9B99; --charcoal:#2D2D2D;
  --blue-900:#001C41; --blue-800:#012A7C; --blue-600:#0088DD; --blue-400:#3CCCFF; --blue-100:#BEEEFF;
  --orange:#E67300; --red:#D12536;

  /* neutrals, biased toward the brand blue rather than pure grey */
  --ground:#F4F6F9; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --line:#DFE5EC; --line-soft:#EDF1F5;
  --ink:#2D2D2D; --ink-2:#5C6D72; --ink-3:#8A98A0;
  --rail:#001C41; --rail-2:#01204A; --rail-ink:rgba(255,255,255,.72);

  --pass:var(--impact-green); --active:var(--primary-blue);
  --caveat:var(--orange); --fail:var(--red); --idle:var(--sage);

  --shadow:0 1px 2px rgba(0,28,65,.06),0 2px 8px rgba(0,28,65,.05);
  --shadow-lg:0 2px 4px rgba(0,28,65,.07),0 8px 24px rgba(0,28,65,.09);
  --r:5px; --rail-w:250px;

  --f-display:'Kanit',system-ui,-apple-system,sans-serif;
  --f-head:'Raleway','Kanit',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#08131F; --surface:#0F1E30; --surface-2:#13243A;
    --line:#22374F; --line-soft:#1A2C42;
    --ink:#E6EDF3; --ink-2:#9FB0BF; --ink-3:#6F8090;
    --rail:#04101D; --rail-2:#08192B;
    --impact-green:#BEDE2E; --primary-blue:#3CCCFF; --orange:#FF9433; --red:#FF5C6B; --sage:#8A9C84;
    --blue-100:#1D3A55;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#08131F; --surface:#0F1E30; --surface-2:#13243A;
  --line:#22374F; --line-soft:#1A2C42;
  --ink:#E6EDF3; --ink-2:#9FB0BF; --ink-3:#6F8090;
  --rail:#04101D; --rail-2:#08192B;
  --impact-green:#BEDE2E; --primary-blue:#3CCCFF; --orange:#FF9433; --red:#FF5C6B; --sage:#8A9C84;
  --blue-100:#1D3A55;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 8px 28px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-display);font-weight:300;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.2;font-weight:600;text-wrap:balance}
a{color:var(--primary-blue)}
:focus-visible{outline:2px solid var(--primary-blue);outline-offset:2px;border-radius:2px}

/* ---------- rail ---------- */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail-w);background:var(--rail);
  color:#fff;padding:22px 0 16px;overflow-y:auto;z-index:60;
  display:flex;flex-direction:column;gap:18px}
.rail .brand{padding:0 20px}
.rail .brand svg{width:96px;height:auto;display:block}
.rail .brand .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--impact-green);margin-top:8px;font-weight:500}
.switch{padding:0 12px}
.switch .lbl{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--rail-ink);padding:0 8px 6px;font-weight:500}
.switch button{display:block;width:100%;text-align:left;font-family:inherit;font-size:12.5px;
  background:transparent;border:0;color:rgba(255,255,255,.78);padding:7px 8px;border-radius:4px;
  cursor:pointer;border-left:2px solid transparent;transition:background .15s,color .15s}
.switch button:hover{background:var(--rail-2);color:#fff}
.switch button.on{background:var(--rail-2);color:#fff;border-left-color:var(--impact-green);font-weight:500}
.switch button span{display:block;font-size:10px;color:rgba(255,255,255,.42);font-weight:300}
.switch button.on span{color:var(--blue-400)}
.rail nav{padding:0 12px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;
  display:flex;flex-direction:column;gap:1px}
.rail nav a{display:flex;align-items:baseline;gap:9px;text-decoration:none;
  color:rgba(255,255,255,.66);font-size:12.5px;padding:6px 8px;border-radius:4px;
  border-left:2px solid transparent;transition:color .15s,background .15s}
.rail nav a:hover,.rail nav a.on{color:#fff;background:var(--rail-2);border-left-color:var(--impact-green)}
.rail nav a i{font-style:normal;font-size:10px;color:var(--impact-green);min-width:14px;font-weight:500}
.rail nav a em{font-style:normal;margin-left:auto;font-size:10.5px;color:rgba(255,255,255,.38);
  font-variant-numeric:tabular-nums}
.rail .foot{margin-top:auto;padding:12px 20px 0;border-top:1px solid rgba(255,255,255,.1);
  font-size:10.5px;color:rgba(255,255,255,.4);line-height:1.6}
.themebtn{margin:0 20px;font-family:inherit;font-size:11px;background:transparent;
  border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:5px 10px;
  border-radius:4px;cursor:pointer}
.themebtn:hover{border-color:var(--impact-green);color:#fff}

/* ---------- shell ---------- */
.page{margin-left:var(--rail-w)}
.wrap{max-width:1140px;margin:0 auto;padding:0 32px}

/* ---------- masthead ---------- */
.mast{background:var(--surface);border-bottom:1px solid var(--line);padding:24px 0 0}
.mast .top{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
.mast h1{font-size:26px;letter-spacing:-.01em}
.mast .who{font-size:12px;color:var(--ink-2);margin-top:5px}
.mast .who b{font-weight:500;color:var(--ink)}
.mast .gen{margin-left:auto;text-align:right;font-size:10.5px;color:var(--ink-3);line-height:1.7}
.mast .gen code{font-family:var(--f-display);font-weight:400;color:var(--ink-2)}

/* phase pipeline — 01..06 is a real sequence, so the numbering carries information */
.pipe{display:flex;gap:2px;margin:20px 0 0;overflow-x:auto;padding-bottom:2px}
.ph{flex:1 1 0;min-width:104px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-bottom:3px solid var(--idle);padding:9px 11px 8px;position:relative}
.ph:first-child{border-radius:var(--r) 0 0 0}.ph:last-child{border-radius:0 var(--r) 0 0}
.ph .n{font-size:9.5px;letter-spacing:.1em;color:var(--ink-3);font-weight:500;
  font-variant-numeric:tabular-nums}
.ph .t{font-size:12.5px;font-weight:500;color:var(--ink);margin-top:1px}
.ph .p{font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ph.active{background:var(--surface);border-bottom-color:var(--active);box-shadow:var(--shadow)}
.ph.active .t{color:var(--active)}
.ph.complete{border-bottom-color:var(--pass)}
.ph.blocked{border-bottom-color:var(--fail)}
.ph .bar{position:absolute;left:0;bottom:-3px;height:3px;background:var(--active);transition:width .5s}

/* gate strip */
.gates{display:flex;gap:0;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);
  overflow:hidden;background:var(--surface)}
.gate{flex:1;padding:11px 14px;display:flex;align-items:center;gap:10px;
  border-right:1px solid var(--line-soft)}
.gate:last-child{border-right:0}
.gate .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--idle)}
.gate.passed .dot{background:var(--pass)}
.gate.ready .dot{background:var(--active)}
.gate.caveats .dot{background:var(--caveat)}
.gate.not-ready .dot{background:var(--fail);box-shadow:0 0 0 3px color-mix(in srgb,var(--fail) 18%,transparent)}
.gate .g{font-size:11px;font-weight:500;color:var(--ink-2);letter-spacing:.04em}
.gate .s{font-size:12px;color:var(--ink)}
.gate .m{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* banner */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--caveat);border-radius:var(--r);
  padding:13px 16px;margin:18px 0 0;box-shadow:var(--shadow)}
.banner .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--caveat);
  font-weight:500;flex:0 0 auto;padding-top:2px;width:108px}
.banner p{margin:0;font-size:12.5px;color:var(--ink-2);max-width:78ch}
.banner p b{font-weight:500;color:var(--ink)}
.banner.stop{border-left-color:var(--fail)}
.banner.stop .k{color:var(--fail)}

/* ---------- sections ---------- */
.sec{padding:34px 0 0}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-h h2{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:.01em}
.sec-h .note{font-size:11.5px;color:var(--ink-3);margin-left:auto;text-align:right;max-width:44ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:10px}
.card-h h3{font-family:var(--f-head);font-size:12.5px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.card-h .r{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.card-b{padding:16px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g23{grid-template-columns:1.6fr 1fr}

/* ---------- the chain (hero) ---------- */
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0 0}
.link{flex:1 1 0;min-width:118px;padding:0 14px;border-left:1px solid var(--line-soft);position:relative}
.link:first-child{border-left:0;padding-left:0}
.link .stage{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--teal);
  font-weight:500}
.link .num{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.05;
  color:var(--ink);font-variant-numeric:tabular-nums;margin-top:3px}
.link .of{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.link .att{font-size:10.5px;font-weight:500;margin-top:5px;font-variant-numeric:tabular-nums}
.link .att.ok{color:var(--ink-3)}
.link .att.warn{color:var(--caveat)}
.link .att.bad{color:var(--fail)}
.link .track{height:4px;background:var(--line-soft);border-radius:2px;margin-top:9px;overflow:hidden}
.link .fill{height:100%;border-radius:2px;transition:width .6s ease}

.ratios{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border-top:1px solid var(--line-soft);margin-top:18px}
.ratio{background:var(--surface);padding:13px 16px}
.ratio .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.ratio .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;
  display:flex;align-items:baseline;gap:7px}
.ratio .v small{font-size:11px;font-weight:400;color:var(--ink-3)}
.ratio .d{font-size:11px;color:var(--ink-2);margin-top:2px;line-height:1.45}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding:0 12px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td b{font-weight:500}
td code{font-family:var(--f-display);font-weight:500;font-size:11.5px;color:var(--teal);
  letter-spacing:.02em;white-space:nowrap}
.scroll{overflow-x:auto}

/* pills */
.pill{display:inline-block;font-size:9.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;
  padding:2.5px 7px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
.pill.pass{background:color-mix(in srgb,var(--impact-green) 20%,transparent);color:#4A5C00;border-color:color-mix(in srgb,var(--impact-green) 45%,transparent)}
.pill.active{background:color-mix(in srgb,var(--primary-blue) 16%,transparent);color:var(--blue-800);border-color:color-mix(in srgb,var(--primary-blue) 40%,transparent)}
.pill.caveat{background:color-mix(in srgb,var(--orange) 15%,transparent);color:#8A4400;border-color:color-mix(in srgb,var(--orange) 40%,transparent)}
.pill.fail{background:color-mix(in srgb,var(--red) 14%,transparent);color:#8E1520;border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.pill.idle{background:color-mix(in srgb,var(--sage) 20%,transparent);color:#4C5A48;border-color:color-mix(in srgb,var(--sage) 45%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.pass{color:#D3EC5E}
  :root:not([data-theme="light"]) .pill.active{color:var(--blue-400)}
  :root:not([data-theme="light"]) .pill.caveat{color:#FFB066}
  :root:not([data-theme="light"]) .pill.fail{color:#FF8A94}
  :root:not([data-theme="light"]) .pill.idle{color:#AEBFA8}}
:root[data-theme="dark"] .pill.pass{color:#D3EC5E}
:root[data-theme="dark"] .pill.active{color:var(--blue-400)}
:root[data-theme="dark"] .pill.caveat{color:#FFB066}
:root[data-theme="dark"] .pill.fail{color:#FF8A94}
:root[data-theme="dark"] .pill.idle{color:#AEBFA8}

/* instrument rows */
.instr{display:grid;grid-template-columns:1fr}
.irow{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line-soft)}
.irow:last-child{border-bottom:0}
.irow:hover{background:var(--surface-2)}
.irow .nm{font-size:12.5px;flex:0 0 208px}
.irow .nm b{font-weight:400}
.irow .meter{flex:1;height:5px;background:var(--line-soft);border-radius:3px;overflow:hidden;min-width:60px}
.irow .meter i{display:block;height:100%;border-radius:3px}
.irow .ct{flex:0 0 52px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.irow .st{flex:0 0 78px;text-align:right}
.irow .up{flex:0 0 72px;text-align:right;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* score bars in use-case table */
.sbar{display:flex;gap:1.5px;align-items:flex-end;height:16px}
.sbar i{width:5px;background:var(--blue-100);border-radius:1px}
.sbar i.f{background:var(--primary-blue)}
.sbar i.cap{background:var(--caveat)}

/* age chip */
.age{display:inline-block;font-size:10.5px;font-weight:500;font-variant-numeric:tabular-nums;
  padding:1.5px 6px;border-radius:3px;background:var(--line-soft);color:var(--ink-2)}
.age.old{background:color-mix(in srgb,var(--caveat) 16%,transparent);color:#8A4400}
.age.stale{background:color-mix(in srgb,var(--red) 14%,transparent);color:#8E1520}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .age.old{color:#FFB066}
  :root:not([data-theme="light"]) .age.stale{color:#FF8A94}}
:root[data-theme="dark"] .age.old{color:#FFB066}
:root[data-theme="dark"] .age.stale{color:#FF8A94}

/* ops strip */
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.op{background:var(--surface);padding:14px 16px}
.op .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:500}
.op .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.op .d{font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.op .d em{font-style:normal;color:var(--fail);font-weight:500}

.empty{padding:22px 16px;font-size:12.5px;color:var(--ink-3);font-style:italic;text-align:center}
.legend{font-size:10.5px;color:var(--ink-3);padding:10px 16px;border-top:1px solid var(--line-soft);
  display:flex;gap:16px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:block}

footer{margin-top:44px;background:var(--rail);color:rgba(255,255,255,.5);padding:20px 0;font-size:11px}
footer .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
footer b{color:rgba(255,255,255,.8);font-weight:500}

/* ---------- portfolio ---------- */
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:16px}
.pfc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;cursor:pointer;text-align:left;font-family:inherit;
  transition:box-shadow .18s,transform .18s;display:flex;flex-direction:column;gap:11px}
.pfc:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.pfc .hd h3{font-size:15px}
.pfc .hd .sc{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.pfc .ph2{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:500}
.pfc .mini{display:flex;gap:2px}
.pfc .mini i{flex:1;height:4px;border-radius:2px;background:var(--line-soft)}
.pfc .kv{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.pfc .kv b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.pfc .alert{font-size:11.5px;font-weight:400;color:var(--fail);display:flex;gap:6px;align-items:baseline}
.pfc .alert::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--fail);flex:0 0 auto;margin-top:5px}

@media(max-width:1080px){
  :root{--rail-w:0px}
  .rail{position:static;width:100%;height:auto;flex-direction:column}
  .rail nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 8px}
  .switch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px}
  .switch .lbl{grid-column:1/-1}
  .page{margin-left:0}.wrap{padding:0 18px}
  .g2,.g3,.g23{grid-template-columns:1fr}
  .ops{grid-template-columns:1fr 1fr}
  .ratios{grid-template-columns:1fr}
}
@media(max-width:680px){
  .mast h1{font-size:21px}.ops{grid-template-columns:1fr}
  .irow .nm{flex-basis:130px}.irow .up{display:none}
  .mast .gen{margin-left:0;text-align:left}
}
</style>

<aside class="rail">

        return '<div class="link"><div class="stage">'+l.stage+'</div>'
          + '<div class="num">'+l.n+'</div>'
          + '<div class="of">of '+l.of+' '+l.ofl+'</div>'
          + '<div class="att '+cls+'">'+(l.of===0?"—":p+"% "+l.note)+'</div>'
          + '<div class="track"><div class="fill" style="width:'+p+'%;background:'+col+'"></div></div>'
          + '</div>'; }).join("")
    + '</div>';

  /* three health ratios */
  var r1=pct(c.requirements.sourced,c.requirements.total),
      r2=pct(c.exceptions.withRuleHolder,c.exceptions.total),
      r3=pct(c.competencyQuestions.answerable,c.competencyQuestions.total);
  h += '<div class="ratios">'
    + '<div class="ratio"><div class="k">Sourcing discipline</div>'
    + '<div class="v" style="color:'+(r1===100?"var(--pass)":"var(--fail)")+'">'+r1+'%<small>'
    + c.requirements.sourced+'/'+c.requirements.total+'</small></div>'
    + '<div class="d">'+(c.requirements.total-c.requirements.sourced>0
        ? '<b>'+(c.requirements.total-c.requirements.sourced)+' unsourced rows</b> sit in the register looking sourced. These block modelling.'
        : 'Every requirement cites evidence.')+'</div></div>'
    + '<div class="ratio"><div class="k">Rule holders named</div>'
    + '<div class="v" style="color:'+(r2>=90?"var(--pass)":r2>=60?"var(--caveat)":"var(--fail)")+'">'+r2+'%<small>'
    + c.exceptions.withRuleHolder+'/'+c.exceptions.total+'</small></div>'
    + '<div class="d">The ceiling on eval quality. An exception with no rule holder cannot be adjudicated.</div></div>'
    + '<div class="ratio"><div class="k">Ontology coverage</div>'
    + '<div class="v" style="color:'+(r3>=90?"var(--pass)":r3>=60?"var(--caveat)":"var(--idle)")+'">'+r3+'%<small>'
    + c.competencyQuestions.answerable+'/'+c.competencyQuestions.total+'</small></div>'
    + '<div class="d">Answerable means <b>run and verified</b> — not that the entities exist and it should work.</div></div>'
    + '</div></div></section>';

  /* evidence class split */
  h += '<section class="sec"><div class="grid g23">'
    + '<div class="card"><div class="card-h"><h3>Evidence by class</h3>'
    + '<div class="r">'+c.evidence.total+' rows</div></div><div class="card-b">';
  var classes=[["Observed",c.evidence.observed,"var(--pass)","An FDE watched it. Primary — can source a requirement alone."],
    ["System",c.evidence.system,"var(--primary-blue)","Log or export. Primary for volume; silent on intent."],
    ["Documented",c.evidence.documented,"var(--caveat)","SOP or policy. Aspirational until observed."],
    ["Stated",c.evidence.stated,"var(--idle)","Interview or transcript. Corroborating only."]];
  h += classes.map(function(x){
      var p = pct(x[1],c.evidence.total);
      return '<div class="irow" style="padding-left:0;padding-right:0">'
        + '<div class="nm"><b>'+x[0]+'</b></div>'
        + '<div class="meter"><i style="width:'+p+'%;background:'+x[2]+'"></i></div>'
        + '<div class="ct">'+x[1]+'</div>'
        + '<div class="up" style="flex-basis:38px">'+p+'%</div></div>'; }).join("")
    + '<div class="legend" style="padding-left:0;padding-right:0">Requirements sourced only from '
    + '<b>&nbsp;Stated&nbsp;</b> evidence are labelled UNVERIFIED and must be verified before build.</div>'
    + '</div></div>';

  /* confidence */
  h += '<div class="card"><div class="card-h"><h3>Requirement confidence</h3></div><div class="card-b">'
    + [["Verified",c.requirements.verified,"pass"],["Unverified",c.requirements.unverified,"caveat"],
       ["Assumption",c.requirements.assumption,"idle"],["With acceptance criteria",c.requirements.withAC,
        c.requirements.withAC===c.requirements.total?"pass":"caveat"]].map(function(x){
      return '<div class="irow" style="padding-left:0;padding-right:0">'
        + '<div class="nm" style="flex-basis:auto;flex:1"><b>'+x[0]+'</b></div>'
        + '<div class="ct">'+x[1]+'</div>'
        + '<div class="st"><span class="pill '+x[2]+'">'+x[2].replace("pass","ok").replace("caveat","watch")+'</span></div>'
        + '</div>'; }).join("")
    + '</div></div></div></section>';

  /* ===== instruments ===== */
  var maxRows = Math.max.apply(null,s.instruments.map(function(i){return i.rows;}).concat([1]));
  h += '<section class="sec" id="discovery"><div class="sec-h"><h2>Discovery instruments</h2>'
    + '<div class="note">Coverage is not readiness. An engagement can have full instruments and still fail G1.</div></div>'
    + '<div class="card"><div class="instr">'
    + s.instruments.map(function(i){
        return '<div class="irow"><div class="nm"><b>'+esc(i.label)+'</b></div>'
          + '<div class="meter"><i style="width:'+pct(i.rows,maxRows)+'%;background:'+STATUS_VAR[i.status]+'"></i></div>'
          + '<div class="ct">'+i.rows+'</div>'
          + '<div class="st"><span class="pill '+PILL[i.status]+'">'+i.status+'</span></div>'
          + '<div class="up">'+esc(i.updated)+'</div></div>'; }).join("")
    + '</div><div class="legend">'
    + '<span><i style="background:var(--pass)"></i>populated — 5+ rows</span>'
    + '<span><i style="background:var(--caveat)"></i>thin — 1 to 4</span>'
    + '<span><i style="background:var(--idle)"></i>empty — 0</span>'
    + '<span style="margin-left:auto">Bar is relative to the largest instrument in this engagement.</span>'
    + '</div></div></section>';

  /* ===== gate criteria detail ===== */
  var openGate = s.gates.filter(function(g){return g.criteria&&g.criteria.length;})[0];
  if(openGate){
    h += '<section class="sec"><div class="sec-h"><h2>'+openGate.id+' — '+esc(openGate.label)+'</h2>'
      + '<div class="note">A gate is a stop, not a status update. The memo recommends; the operator decides.</div></div>'
      + '<div class="card"><div class="card-h"><h3>Criteria</h3>'
      + '<div class="r">'+GATE_LABEL[openGate.status]+'</div></div><div class="scroll"><table>'
      + '<thead><tr><th>Criterion</th><th>Status</th><th>Evidence</th><th>To close</th><th>Owner</th></tr></thead><tbody>'
      + openGate.criteria.map(function(x){
          return '<tr><td><b>'+esc(x.name)+'</b></td>'
            + '<td><span class="pill '+PILL[x.status]+'">'+x.status+'</span></td>'
            + '<td><code>'+esc(x.evidence||"—")+'</code></td>'
            + '<td>'+esc(x.toClose||"—")+'</td><td>'+esc(x.owner||"—")+'</td></tr>'; }).join("")
      + '</tbody></table></div></div></section>';
  }

  /* ===== questions + RAID ===== */
  h += '<section class="sec" id="questions"><div class="sec-h"><h2>Questions and RAID</h2>'
    + '<div class="note">Ranked by what is blocked, not by curiosity. Aged questions blocking a top use case come first.</div></div>'
    + '<div class="grid g2"><div class="card"><div class="card-h"><h3>Open questions</h3>'
    + '<div class="r">'+s.openQuestions.length+' unanswered</div></div>';
  if(s.openQuestions.length){
    h += '<div class="scroll"><table><thead><tr><th>Id</th><th>Question</th><th>Blocks</th><th class="n">Age</th></tr></thead><tbody>'
      + s.openQuestions.slice().sort(function(a,b){return b.ageDays-a.ageDays;}).map(function(q){
          var ac = q.ageDays>=14?"stale":q.ageDays>=7?"old":"";
          return '<tr><td><code>'+esc(q.id)+'</code></td>'
            + '<td><b>'+esc(q.question)+'</b><br><span style="color:var(--ink-3);font-size:11.5px">'+esc(q.why)+'</span></td>'
            + '<td>'+esc(q.blocks)+'<br><span style="color:var(--ink-3);font-size:11.5px">'+esc(q.owner)+'</span></td>'
            + '<td class="n"><span class="age '+ac+'">'+q.ageDays+'d</span></td></tr>'; }).join("")
      + '</tbody></table></div>';
  } else { h += '<div class="empty">No open questions.</div>'; }
  h += '</div>';

  h += '<div class="card"><div class="card-h"><h3>RAID</h3><div class="r">'+s.raid.length+' open</div></div>';
  if(s.raid.length){
    h += '<div class="scroll"><table><thead><tr><th>Type</th><th>Item</th><th>Owner</th><th>Review</th></tr></thead><tbody>'
      + s.raid.map(function(r){
          var bad = !r.owner || !r.review;
          return '<tr><td><span class="pill '+(r.impact==="high"?"fail":r.impact==="medium"?"caveat":"idle")+'">'+esc(r.type)+'</span></td>'
            + '<td>'+esc(r.item)+'</td><td>'+esc(r.owner||"—")+'</td>'
            + '<td>'+(bad ? '<span class="pill fail">untracked</span>' : esc(r.review))+'</td></tr>'; }).join("")
      + '</tbody></table></div><div class="legend">An entry with no owner or no review date is not tracked — it renders as a defect, deliberately.</div>';
  } else { h += '<div class="empty">RAID log empty.</div>'; }
  h += '</div></div></section>';

  /* ===== use cases ===== */
  h += '<section class="sec" id="usecases"><div class="sec-h"><h2>Use-case portfolio</h2>'
    + '<div class="note">Feasibility is capped at the data score. Any dimension at 1 is a stop, not a low score to average away.</div></div>';
  if(s.useCases.length){
    var DIMS=["value","feasibility","data","aiSuitability","risk","timeToValue","reusability"];
    h += '<div class="card"><div class="scroll"><table><thead><tr><th class="n">#</th><th>Use case</th>'
      + '<th>Scores</th><th class="n">Total</th><th class="n">Cost / txn</th><th>Blocker</th><th>Status</th></tr></thead><tbody>'
      + s.useCases.map(function(u){
          var bars = DIMS.map(function(d){
            var v=u.scores[d]; var capped = (d==="feasibility" && u.scores.feasibility>u.scores.data);
            return '<i class="'+(capped?"cap":"f")+'" style="height:'+(v/5*16)+'px" title="'+d+': '+v+'"></i>'; }).join("");
          return '<tr><td class="n">'+u.rank+'</td>'
            + '<td><b>'+esc(u.name)+'</b></td>'
            + '<td><div class="sbar">'+bars+'</div></td>'
            + '<td class="n"><b>'+u.total+'</b></td>'
            + '<td class="n">'+esc(u.unitCost)+'<br><span style="color:var(--ink-3);font-size:11px">'+esc(u.volumeAssumed)+'</span></td>'
            + '<td>'+(u.blocker?esc(u.blocker)+'<br><span style="color:var(--ink-3);font-size:11.5px">'+esc(u.blockerOwner)+'</span>':'—')+'</td>'
            + '<td><span class="pill '+(PILL[u.status]||"idle")+'">'+esc(u.status)+'</span></td></tr>'; }).join("")
      + '</tbody></table></div><div class="legend">'
      + '<span>Bars, left to right: value · feasibility · data · AI fit · risk · time to value · reusability</span>'
      + '<span><i style="background:var(--caveat)"></i>feasibility exceeding the data score — cap it</span>'
      + '</div></div>';
  } else { h += '<div class="card"><div class="empty">No candidates scored yet. Run <b>/qualify</b>.</div></div>'; }
  h += '</section>';

  /* ===== ontology + evals + autonomy ===== */
  h += '<section class="sec" id="ontology"><div class="sec-h"><h2>Ontology and evals</h2>'
    + '<div class="note">Competency questions map 1:1 to governed read templates, so coverage is countable rather than asserted.</div></div>'
    + '<div class="ops" style="margin-bottom:16px">'
    + '<div class="op"><div class="k">Promoted</div><div class="v">'+c.ontologyObjects.promoted+'</div>'
    + '<div class="d">Objects in the ontology repo, each logged against the requirement that justified it.</div></div>'
    + '<div class="op"><div class="k">Backlog</div><div class="v">'+c.ontologyObjects.backlog+'</div>'
    + '<div class="d">Candidates awaiting a precondition — grain, identity rule, or a question that needs them.</div></div>'
    + '<div class="op"><div class="k">Eval cases</div><div class="v">'+c.evalCases.total+'</div>'
    + '<div class="d">'+(c.evalCases.total?c.evalCases.passing+' passing · '+c.evalCases.failing+' failing':'None built. Golden sets come from the exception register.')+'</div></div>'
    + '<div class="op"><div class="k">P0 failures</div><div class="v" style="color:'+(c.evalCases.p0?"var(--fail)":"var(--ink)")+'">'+c.evalCases.p0+'</div>'
    + '<div class="d">'+(c.evalCases.p0?'<em>A P0 is a stop.</em>':'Wrong answer presented as correct, unauthorised write, or a permission-boundary crossing.')+'</div></div>'
    + '</div>';

  h += '<div class="card"><div class="card-h"><h3>Autonomy ledger</h3>'
    + '<div class="r">a rung is a measurement, not a phase name</div></div>';
  if(s.autonomy.length){
    h += '<div class="scroll"><table><thead><tr><th>Workflow</th><th>Rung</th><th class="n">Agreement</th>'
      + '<th class="n">Sample</th><th>Divergence</th><th>Decided by</th></tr></thead><tbody>'
      + s.autonomy.map(function(a){
          var measured = a.agreement!==null;
          return '<tr><td><b>'+esc(a.workflow)+'</b></td>'
            + '<td><span class="pill '+(measured?"active":"fail")+'">'+esc(a.rung)+'</span></td>'
            + '<td class="n">'+(measured
                ? '<b>'+Math.round(a.agreement*100)+'%</b>'
                : '<span class="pill fail">asserted, not measured</span>')+'</td>'
            + '<td class="n">'+(a.sample?a.sample+'<br><span style="color:var(--ink-3);font-size:11px">'+esc(a.window)+'</span>':'—')+'</td>'
            + '<td>'+(a.divergence==="n/a"?'—':'<span class="pill '+(a.divergence==="clustered"?"caveat":"fail")+'">'+a.divergence+'</span>'
                + '<br><span style="color:var(--ink-3);font-size:11.5px">'+esc(a.divergenceDetail)+'</span>')+'</td>'
            + '<td>'+esc(a.decidedBy||"—")+'</td></tr>'; }).join("")
      + '</tbody></table></div><div class="legend">Clustered divergence is a fixable gap — usually a rule already in the '
      + 'exception register. Scattered divergence is a capability ceiling. They look identical in a summary metric.</div>';
  } else { h += '<div class="empty">No workflows measured. Nothing has earned a rung.</div>'; }
  h += '</div></section>';

  /* ===== ops ===== */
  h += '<section class="sec" id="ops"><div class="sec-h"><h2>Deliverables and ops</h2>'
    + '<div class="note">Nothing is a client deliverable until it has been rendered.</div></div>'
    + '<div class="grid g2">';

  h += '<div class="card"><div class="card-h"><h3>Deliverables</h3><div class="r">'
    + s.deliverables.filter(function(d){return d.rendered;}).length+' of '+s.deliverables.length+' rendered</div></div>';
  if(s.deliverables.length){
    h += '<div class="instr">'+s.deliverables.map(function(d){
        return '<div class="irow"><div class="nm" style="flex:1;flex-basis:auto"><b>'+esc(d.name)+'</b>'
          + '<br><span style="color:var(--ink-3);font-size:11px">'+esc(d.phase)+'</span></div>'
          + '<div class="st"><span class="pill '+(d.rendered?"pass":"idle")+'">'+(d.rendered?"rendered":"pending")+'</span></div>'
          + '<div class="up">'+esc(d.renderedAt||"—")+'</div></div>'; }).join("")+'</div>';
  } else { h += '<div class="empty">Nothing rendered yet. Run <b>/render</b>.</div>'; }
  h += '</div>';

  h += '<div class="card"><div class="card-h"><h3>Datasources</h3><div class="r">read-only to the harness</div></div>';
  if(s.datasources.length){
    h += '<div class="scroll"><table><thead><tr><th>File</th><th>Source</th><th>Class</th><th class="n">Size</th></tr></thead><tbody>'
      + s.datasources.map(function(d){
          return '<tr><td><code>'+esc(d.name)+'</code></td><td>'+esc(d.source)+'</td>'
            + '<td><span class="pill '+(d.classification==="redacted"?"pass":d.classification==="converted"?"active":"caveat")+'">'
            + esc(d.classification)+'</span></td>'
            + '<td class="n">'+kb(d.sizeBytes)+'</td></tr>'; }).join("")
      + '</tbody></table></div>';
  } else { h += '<div class="empty">No sources received.</div>'; }
  h += '</div></div>';

  /* skills + improver */
  h += '<div class="grid g2" style="margin-top:16px">'
    + '<div class="card"><div class="card-h"><h3>Skills in force</h3><div class="r">'
    + (s.skills.practice+s.skills.engagement+s.skills.function)+' loaded</div></div><div class="card-b">'
    + '<div class="irow" style="padding-left:0;padding-right:0"><div class="nm" style="flex:1;flex-basis:auto">'
    + '<b>Practice</b> <span style="color:var(--ink-3)">— reusable across every client</span></div><div class="ct">'+s.skills.practice+'</div></div>'
    + '<div class="irow" style="padding-left:0;padding-right:0"><div class="nm" style="flex:1;flex-basis:auto">'
    + '<b>Engagement</b> <span style="color:var(--ink-3)">— client-calibrated, supersede practice</span></div><div class="ct">'+s.skills.engagement+'</div></div>'
    + '<div class="irow" style="padding-left:0;padding-right:0"><div class="nm" style="flex:1;flex-basis:auto">'
    + '<b>Function</b> <span style="color:var(--ink-3)">— harness operation</span></div><div class="ct">'+s.skills.function+'</div></div>';
  if(s.skills.supersedes.length){
    h += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)">'
      + '<div class="k" style="font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:500;margin-bottom:7px">Active supersedes</div>'
      + s.skills.supersedes.map(function(x){
          return '<div style="font-size:12px;color:var(--ink-2);margin-bottom:4px"><code>'+esc(x.engagementSkill)
            + '</code> &rarr; overrides <code>'+esc(x.practiceSkill)+'</code></div>'; }).join("")
      + '</div>';
  }
  h += '</div></div>';

  var hi = s.harnessImprover;
  h += '<div class="card"><div class="card-h"><h3>Improvement loop</h3><div class="r">'
    + (hi.lastRun?'last run '+esc(hi.lastRun):'never run')+'</div></div><div class="card-b">'
    + '<div class="ratios" style="margin-top:0;border-top:0;grid-template-columns:1fr 1fr">'
    + '<div class="ratio" style="padding:0 14px 12px 0"><div class="k">Open proposals</div>'
    + '<div class="v">'+hi.openProposals+'</div><div class="d">Awaiting per-proposal approval. Never batched.</div></div>'
    + '<div class="ratio" style="padding:0 0 12px 14px"><div class="k">Pending prompt edits</div>'
    + '<div class="v" style="color:'+(hi.pendingPromptEdits?"var(--caveat)":"var(--ink)")+'">'+hi.pendingPromptEdits+'</div>'
    + '<div class="d">Held in feedback for deliberate promotion. <b>harness-improver never edits an agent prompt.</b></div></div>'
    + '</div>';
  if(s.friction.length){
    var real = s.friction.filter(function(f){return f.note!=="None.";});
    h += '<div style="margin-top:4px;padding-top:12px;border-top:1px solid var(--line-soft)">'
      + '<div style="font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);font-weight:500;margin-bottom:8px">'
      + 'Friction cited in recent sessions</div>'
      + (real.length ? real.map(function(f){
          return '<div style="font-size:12px;color:var(--ink-2);margin-bottom:8px;padding-left:11px;border-left:2px solid var(--line)">'
            + esc(f.note)+'<br><span style="color:var(--ink-3);font-size:11px">'+esc(f.session)+'</span></div>'; }).join("")
        : '<div style="font-size:12px;color:var(--ink-3)">None logged. Legitimate — but a permanently empty list means the loop is not running.</div>')
      + '</div>';
  }
  h += '</div></div></div></section>';

  /* last session */
  h += '<section class="sec"><div class="card"><div class="card-h"><h3>Last session</h3>'
    + '<div class="r"><code>'+esc(s.sessions.latest)+'</code> · '+esc(s.sessions.latestDate)+'</div></div>'
    + '<div class="card-b"><p style="margin:0;max-width:80ch;font-size:13.5px">'+esc(s.sessions.latestSummary)+'</p></div></div>'
    + '<div style="height:8px"></div></section></div>';

  document.getElementById("page").innerHTML = h;
}

function render(){
  buildSwitch();
  if(view===-1){ document.getElementById("nav").innerHTML=""; renderPortfolio(); }
  else { var s=STATE[view]; buildNav(s); renderEngagement(s); wireNav(); }
}

function wireNav(){
  var links = Array.prototype.slice.call(document.querySelectorAll("#nav a"));
  var secs  = links.map(function(a){ return document.getElementById(a.getAttribute("href").slice(1)); });
  if(!("IntersectionObserver" in window)) return;
  var io = new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(en.isIntersecting){
        var i = secs.indexOf(en.target);
        links.forEach(function(l){ l.classList.remove("on"); });
        if(i>-1) links[i].classList.add("on");
      }});
  },{rootMargin:"-10% 0px -78% 0px"});
  secs.forEach(function(x){ if(x) io.observe(x); });
}

/* theme toggle */
document.getElementById("themebtn").addEventListener("click",function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var isDark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
});

render();
</script>
