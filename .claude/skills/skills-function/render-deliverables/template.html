<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — {{CLIENT}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Raleway:wght@500;600&display=swap" rel="stylesheet">
<style>
/* HGS brand tokens — source: hgs.com/brand
   Impact Green is accent ONLY: never behind body copy, never a large block. */
:root{
  --impact-green:#ABCF02; --primary-blue:#00B0F0;
  --system:#26476B; --blue-900:#001C41; --teal:#3D9B99;
  --foundation:#5C6D72; --charcoal:#2D2D2D; --sage:#9AAC94;
  --orange:#E67300; --red:#D12536;
  --ground:#F4F6F9; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --line:#DFE5EC; --line-soft:#EDF1F5;
  --ink:#2D2D2D; --ink-2:#5C6D72; --ink-3:#8A98A0;
  --shadow:0 1px 2px rgba(0,28,65,.06),0 2px 8px rgba(0,28,65,.05);
  --r:5px;
  --f:'Kanit',system-ui,-apple-system,sans-serif;
  --f-head:'Raleway','Kanit',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#08131F; --surface:#0F1E30; --surface-2:#13243A;
    --line:#22374F; --line-soft:#1A2C42;
    --ink:#E6EDF3; --ink-2:#9FB0BF; --ink-3:#6F8090;
    --impact-green:#BEDE2E; --primary-blue:#3CCCFF; --orange:#FF9433; --red:#FF5C6B;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#08131F; --surface:#0F1E30; --surface-2:#13243A;
  --line:#22374F; --line-soft:#1A2C42;
  --ink:#E6EDF3; --ink-2:#9FB0BF; --ink-3:#6F8090;
  --impact-green:#BEDE2E; --primary-blue:#3CCCFF; --orange:#FF9433; --red:#FF5C6B;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);
  font-weight:300;font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
.hd{background:var(--blue-900);color:#fff;padding:34px 0 30px}
.wrap{max-width:820px;margin:0 auto;padding:0 34px}
.hd .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--impact-green);font-weight:500}
.hd h1{font-size:31px;font-weight:600;margin:12px 0 0;line-height:1.18;text-wrap:balance}
.hd .meta{margin-top:18px;padding-top:15px;border-top:1px solid rgba(255,255,255,.16);
  display:flex;gap:28px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.6)}
.hd .meta b{display:block;font-weight:500;color:#fff;font-size:13.5px}
.arc{height:4px;background:linear-gradient(90deg,var(--impact-green) 0 24%,
  var(--teal) 24% 50%,var(--primary-blue) 50% 76%,var(--system) 76% 100%)}
main{padding:38px 0 60px}
article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:38px 42px}
article>:first-child{margin-top:0}
h1,h2,h3,h4{font-weight:600;line-height:1.24;text-wrap:balance;color:var(--ink)}
article h1{font-size:26px;margin:36px 0 12px}
article h2{font-family:var(--f-head);font-size:20px;margin:34px 0 11px;
  padding-bottom:7px;border-bottom:1px solid var(--line-soft)}
article h3{font-size:16px;margin:26px 0 8px;color:var(--system)}
article h4{font-size:14px;margin:20px 0 6px;color:var(--ink-2)}
p{margin:0 0 14px;max-width:68ch}
ul,ol{margin:0 0 14px;padding-left:22px;max-width:68ch}li{margin-bottom:6px}
a{color:var(--primary-blue)}
strong{font-weight:500;color:var(--ink)}
blockquote{margin:18px 0;padding:12px 18px;border-left:3px solid var(--impact-green);
  background:var(--surface-2);color:var(--ink-2);border-radius:0 var(--r) var(--r) 0}
blockquote p:last-child{margin-bottom:0}
code{font-family:var(--f);font-weight:500;font-size:.92em;color:var(--teal);
  background:var(--surface-2);padding:1px 5px;border-radius:3px}
pre{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:14px 16px;overflow-x:auto;font-size:13px}
pre code{background:none;padding:0;color:var(--ink)}
.tw{overflow-x:auto;margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--system);color:#fff;text-align:left;font-weight:500;font-size:11.5px;
  letter-spacing:.05em;padding:9px 12px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:nth-child(even) td{background:var(--surface-2)}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}
.mermaid{margin:20px 0;text-align:center;overflow-x:auto}
footer{background:var(--blue-900);color:rgba(255,255,255,.5);padding:22px 0;font-size:11.5px}
footer .wrap{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
footer b{color:rgba(255,255,255,.8);font-weight:500}
.fallback{white-space:pre-wrap;font-size:13.5px;color:var(--ink-2)}
@media(max-width:680px){
  .wrap{padding:0 18px}.hd h1{font-size:23px}article{padding:24px 20px}
  article h1{font-size:21px}article h2{font-size:17px}
}
@media print{
  body{background:#fff}.hd{background:#fff;color:#000;border-bottom:2px solid var(--system)}
  .hd .eyebrow{color:var(--system)}.hd h1{color:var(--system)}
  .hd .meta{color:#444;border-top-color:#ccc}.hd .meta b{color:#000}
  article{box-shadow:none;border:0;padding:0}th{background:#eee;color:#000}
  footer{background:#fff;color:#666;border-top:1px solid #ccc}footer b{color:#000}
}
</style>
</head>
<body>

<header class="hd">
  <div class="wrap">
    <div class="eyebrow">{{CLIENT}} · {{PHASE}}</div>
    <h1>{{TITLE}}</h1>
    <div class="meta">
      <div><b>{{CLIENT}}</b>Client</div>
      <div><b>{{PHASE}}</b>Phase</div>
      <div><b>{{DATE}}</b>Issued</div>
    </div>
  </div>
</header>
<div class="arc"></div>

<main>
  <div class="wrap">
    <article id="doc"><div class="fallback" id="fallback"></div></article>
  </div>
</main>

<footer>
  <div class="wrap">
    <div><b>HGS</b> · Forward deployed engineering</div>
    <div>{{CLIENT}} · {{PHASE}} · issued {{DATE}}</div>
  </div>
</footer>

<script id="src" type="text/plain">{{CONTENT}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<script>
/* The raw markdown ships inside the page, so a CDN failure degrades to readable
   plain text rather than a blank deliverable on a client laptop. */
(function(){
  var raw = document.getElementById("src").textContent;
  var doc = document.getElementById("doc");
  var fb  = document.getElementById("fallback");

  if (typeof marked === "undefined") { fb.textContent = raw; return; }

  marked.setOptions({ gfm: true, breaks: false });
  doc.innerHTML = marked.parse(raw);

  /* wide content scrolls in its own container; the page body never scrolls sideways */
  Array.prototype.forEach.call(doc.querySelectorAll("table"), function (t) {
    var w = document.createElement("div");
    w.className = "tw";
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });

  /* fenced mermaid blocks -> diagrams */
  var blocks = doc.querySelectorAll("pre > code.language-mermaid");
  if (blocks.length && typeof mermaid !== "undefined") {
    Array.prototype.forEach.call(blocks, function (b) {
      var d = document.createElement("div");
      d.className = "mermaid";
      d.textContent = b.textContent;
      b.parentNode.replaceWith(d);
    });
    var dark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") &&
        window.matchMedia("(prefers-color-scheme: dark)").matches);
    try {
      mermaid.initialize({
        startOnLoad: true,
        theme: dark ? "dark" : "base",
        themeVariables: {
          primaryColor: "#BEEEFF", primaryTextColor: dark ? "#E6EDF3" : "#2D2D2D",
          primaryBorderColor: "#26476B", lineColor: "#5C6D72",
          fontFamily: "Kanit, system-ui, sans-serif"
        }
      });
    } catch (e) { /* diagram falls back to its source text */ }
  }
})();
</script>
</body>
</html>
